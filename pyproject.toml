[project]
name = "colab-studio"
version = "0.1.0"
description = "Repo-level Google Colab GPU Studio for Qwen-Image-2.1-Turbo-GGUF and open-weight models, managed by uv"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "google-colab-cli==0.7.4",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
ui = [
    "gradio>=5.0.0",
]

[project.scripts]
cstudio = "cstudio.cli:main"
cstudio-patch = "cstudio.patch_colab_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cstudio", "remote"]
