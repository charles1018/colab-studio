[project]
name = "colab-studio"
version = "0.1.0"
description = "Google Colab GPU studio for image generation and editing with Qwen-Image-2.1-Turbo, using native INT8 by default and supporting BF16 and GGUF weights"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "google-colab-cli==0.7.4",
    "filelock>=4.2",
    "pillow>=10.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
cstudio = "cstudio.cli:main"
cstudio-ui = "cstudio.webui:main"
cstudio-patch = "cstudio.patch_colab_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cstudio", "remote"]
